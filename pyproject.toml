# Tool configuration only (dev deps: requirements-dev.txt).
# The App itself is built from home_starter/Dockerfile.
[tool.pytest.ini_options]
pythonpath = ["home_starter/server", "devtools"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "S"]
ignore = ["S101", "S104", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"devtools/**" = ["S105", "S106", "S107"]
