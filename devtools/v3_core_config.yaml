# Disposable localhost Core only. Never deploy these simulated appliances to a house.
homeassistant:
  name: Surface test house
  latitude: 0
  longitude: 0
  elevation: 0
  unit_system: metric
  time_zone: Australia/Sydney
  country: AU
default_config:
input_boolean:
  kitchen_lamp:
    name: Kitchen lamp fixture
  heating:
    name: Heating fixture
  leak:
    name: Leak fixture
input_select:
  washer_cycle:
    name: Washer cycle fixture
    options: [idle, running, complete]
template:
  - sensor:
      - name: Kitchen temperature
        unique_id: hs_fixture_temperature
        state: '21.5'
        device_class: temperature
        unit_of_measurement: °C
      - name: Washer status
        unique_id: hs_fixture_washer
        state: "{{ states('input_select.washer_cycle') }}"
    binary_sensor:
      - name: Kitchen leak
        unique_id: hs_fixture_leak
        device_class: moisture
        state: "{{ is_state('input_boolean.leak', 'on') }}"
    light:
      - name: Kitchen light
        unique_id: hs_fixture_light
        state: "{{ is_state('input_boolean.kitchen_lamp', 'on') }}"
        turn_on:
          action: input_boolean.turn_on
          target:
            entity_id: input_boolean.kitchen_lamp
        turn_off:
          action: input_boolean.turn_off
          target:
            entity_id: input_boolean.kitchen_lamp
climate:
  - platform: generic_thermostat
    name: Kitchen air conditioning
    unique_id: hs_fixture_climate
    heater: input_boolean.heating
    target_sensor: sensor.kitchen_temperature
    min_temp: 16
    max_temp: 28
    target_temp: 22
    initial_hvac_mode: 'off'
