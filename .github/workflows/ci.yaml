name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest
      - run: node --test tests/js/*.test.mjs
      - run: python devtools/privacy_check.py

  lint-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: frenck/action-addon-linter@v2.21
        with:
          path: ./home_starter

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Verify pinned MA source
        run: python devtools/prepare_media_preview_ci.py
      - name: Install frozen frontend dependencies without lifecycle scripts
        run: corepack pnpm@11.8.0 install --frozen-lockfile --ignore-scripts
        working-directory: .runtime/ma-household-upstream
      - name: Prepare isolated household entry
        run: python devtools/ma_frontend_preview/prepare.py
      - name: Compile household audio interface
        run: node node_modules/vite/bin/vite.js build --config household-preview/vite.config.ts --mode household-release
        working-directory: .runtime/ma-household-upstream
      - name: Package exact candidate context
        run: python devtools/package_media_preview.py .runtime/media-preview-ci
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build image (amd64 + arm64, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: ./.runtime/media-preview-ci/home_starter
          platforms: linux/amd64,linux/arm64
          push: false
      - uses: actions/upload-artifact@v4
        with:
          name: household-audio-build-evidence
          path: |
            .runtime/media-preview-ci/CANDIDATE.json
            .runtime/media-preview-ci/home_starter/server/homestarter/static/media-preview/manifest.json
