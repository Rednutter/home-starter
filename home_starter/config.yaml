# https://developers.home-assistant.io/docs/apps/configuration#app-configuration
name: Home Starter
version: "0.2.0"
slug: home_starter
description: >-
  Get the house ready, review rooms and devices, and set up useful things
  starting with music around the house (Music Assistant).
url: https://github.com/Rednutter/home-starter
arch:
  - aarch64
  - amd64
# The image brings s6-overlay v3, which must be PID 1.
init: false

# Ingress UI only (default ingress port 8099, no host ports). The sidebar
# panel is admin-only by default, which is right for installing apps.
ingress: true
panel_icon: mdi:rocket-launch-outline
panel_title: Home Starter

# Registry reads and explicit, admin-only device room assignments through Core.
homeassistant_api: true

# Supervisor API. `manager` is the lowest role that may list installed apps,
# read app store metadata, add an app repository, install an app and start it
# (supervisor/api/middleware/security.py). Writes happen only after an
# explicit button press in the UI.
hassio_api: true
hassio_role: manager
