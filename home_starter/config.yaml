# https://developers.home-assistant.io/docs/apps/configuration#app-configuration
name: Home Starter
version: "0.8.44"
slug: home_starter
description: >-
  Get the house ready, review rooms and devices, set up music,
  and generate native household screens for people and places.
url: https://github.com/Rednutter/home-starter
arch:
  - aarch64
  - amd64
# The image brings s6-overlay v3, which must be PID 1.
init: false

# Administration uses ingress only. The separate household listener is disabled
# until specifically enabled and mapped to the approved home-LAN host port.
ports:
  8098/tcp: null
ports_description:
  8098/tcp: Restricted household audio (approved LAN port 13379 only)
options:
  household_lan: false
  household_lan_surface: ""
  household_lan_binding: ""
schema:
  household_lan: bool
  household_lan_surface: str
  household_lan_binding: str
# The sidebar
# panel is admin-only by default, which is right for installing apps.
ingress: true
panel_icon: mdi:rocket-launch-outline
panel_title: Home Starter

# Registry reads, confirmed room/dashboard changes, and explicitly configured
# activity sensors through Core. Dashboard controls use the viewing HA account.
homeassistant_api: true

# Supervisor API. `manager` is the lowest role that may list installed apps,
# read app store metadata, add an app repository, install an app and start it
# (supervisor/api/middleware/security.py). Writes happen only after an
# explicit button press in the UI.
hassio_api: true
hassio_role: manager
